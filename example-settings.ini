[settings]

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;    DISTILLERY CONFIGURATION    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; ARCHIVESSPACE CONFIGURATION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Repository ID in ArchivesSpace (defaults to "2" if not specified)
ARCHIVESSPACE_REPOSITORY_ID=2

; ArchivesSpace API URL
ARCHIVESSPACE_API_URL=https://your-archivesspace-instance.org/api
; Staff URL for ArchivesSpace
ARCHIVESSPACE_STAFF_URL=https://your-archivesspace.example.org/staff

; ArchivesSpace authentication credentials
ARCHIVESSPACE_USERNAME=your_username
ARCHIVESSPACE_PASSWORD=your_password

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; AWS S3 CONFIGURATION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; AWS credentials for general S3 operations
AWS_ACCESS_KEY_ID=your_aws_access_key_id
AWS_SECRET_ACCESS_KEY=your_aws_secret_access_key

; S3 bucket name (ARK resolver redirect pages only -- preservation content
; goes to PRESERVATION_MOUNT_PARENT below, not directly to S3)
RESOLVER_BUCKET=your-ark-resolver-bucket

; Optional. CloudFront distribution ID fronting RESOLVER_BUCKET -- if set,
; execute invalidates each updated object's /inventory.json path there
; after a batch run, so a cached copy doesn't outlive the upload.
RESOLVER_CLOUDFRONT_DISTRIBUTION_ID=your-resolver-cloudfront-distribution-id

; S3 path configuration
COMMON_PATH_PREFIX=your/common/path/prefix/

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; ARK CONFIGURATION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; ARK namespace and minting parameters
OUR_NMA=n2t.net
OUR_NAAN=your-naan-number
OUR_SHOULDER=your-shoulder
ARK_BLADE_LENGTH=6

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; FILE SYSTEM CONFIGURATION
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; Mount and directory paths
ABSOLUTE_MOUNT_PARENT=/path/to/mount/parent
RELATIVE_SOURCE_DIRECTORY=source
RELATIVE_BATCH_DIRECTORY=batch

; Local NAS destination for OCFL objects (mirrored to S3 by a sync tool,
; outside of Distillery -- see OCFL-PRESERVATION-PLAN.md). Storage
; and staging directories are both relative to one shared mount parent so
; they're guaranteed to be on the same filesystem (required for atomic
; os.rename() writes). PRESERVATION_MOUNT_PARENT must be the specific
; mounted volume/share itself, not a multi-share directory like macOS's
; /Volumes -- subdirectories of that can be different filesystems.
PRESERVATION_MOUNT_PARENT=/path/to/mounted/preservation/volume
RELATIVE_OCFL_STORAGE_DIRECTORY=ocfl-storage
RELATIVE_OCFL_STAGING_DIRECTORY=ocfl-staging

; Optional. Hostname of the NAS holding PRESERVATION_MOUNT_PARENT, used to
; build a definitive (not necessarily network-resolvable) file:// URI for
; each OCFL object's ArchivesSpace file_version -- see
; OCFL-PRESERVATION-PLAN.md §2, "file_version use_statement and multi-copy
; convention". If unset, the URI's authority is left empty ("file:///..."),
; which per RFC 8089 conventionally means localhost.
PRESERVATION_NAS_HOSTNAME=nas.example.edu

; Files to remove during processing (comma-separated list)
FILES_TO_REMOVE=.DS_Store,Thumbs.db,.gitkeep

[loggers]
keys=root,distillery,cascflow

[handlers]
keys=console,file

[formatters]
keys=console,file

[logger_root]
level=DEBUG
handlers=console

[logger_distillery]
level=DEBUG
handlers=console,file
qualname=distillery
propagate=0

[logger_cascflow]
level=DEBUG
handlers=console,file
qualname=cascflow
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=console
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=file
args=('./distillery.log', 'a', 1000000, 9, 'utf-8')

[formatter_console]
format=%(message)s
datefmt=

[formatter_file]
format=%(asctime)s - %(name)s:%(lineno)d %(funcName)s - %(levelname)s - %(message)s
datefmt=
